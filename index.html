<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tìm kiếm & Chỉnh sửa Đơn hàng</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen p-4">
  <div class="max-w-7xl mx-auto">
    <!-- Header -->
    <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
      <div class="flex items-center gap-3 mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        <h1 class="text-3xl font-bold text-gray-800">Tìm kiếm & Chỉnh sửa Đơn hàng</h1>
      </div>

      <!-- Warning -->
      <div class="mb-4 bg-yellow-50 border border-yellow-200 rounded-lg p-4">
        <p class="text-sm text-yellow-800">
          ⚠️ <strong>Lưu ý:</strong> Để tránh lỗi CORS, hệ thống sử dụng CORS proxy. 
          Để bảo mật tốt nhất, khuyến nghị chạy trên máy local.
        </p>
      </div>

      <!-- API URL Config -->
      <div class="mb-4">
        <label class="block text-sm font-semibold text-gray-700 mb-2">
          🔗 URL Google Apps Script:
        </label>
        <input 
          type="text" 
          id="apiUrl" 
          value="https://script.google.com/macros/s/AKfycbwG0bNXV5BJQYglU6PcPa4TiZuoJXfl4ImMrhOQgwrhBwCza_UKfz1L3guqunLKUrk/exec"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
        >
      </div>

      <!-- Load Button -->
      <button 
        id="loadBtn" 
        class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 disabled:bg-gray-400 transition"
      >
        📦 Tải dữ liệu từ Google Sheets
      </button>

      <!-- Status -->
      <div id="statusMessage" class="hidden mt-4 p-4 rounded-lg"></div>
      
      <!-- Stats -->
      <div id="statsBox" class="hidden mt-4 flex gap-4">
        <div class="bg-green-100 px-4 py-2 rounded-lg flex-1 text-center">
          <div class="text-2xl font-bold text-green-800" id="totalRows">0</div>
          <div class="text-sm text-green-600">Đơn hàng</div>
        </div>
        <div class="bg-blue-100 px-4 py-2 rounded-lg flex-1 text-center">
          <div class="text-2xl font-bold text-blue-800" id="totalSheets">0</div>
          <div class="text-sm text-blue-600">Sheets</div>
        </div>
      </div>
    </div>

    <!-- Search Section -->
    <div id="searchSection" class="hidden bg-white rounded-lg shadow-lg p-6 mb-6">
      <div class="flex gap-3">
        <input
          type="text"
          id="phoneInput"
          placeholder="Nhập số điện thoại cần tìm..."
          class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 text-lg"
        >
        <button
          id="searchBtn"
          class="px-6 py-3 bg-indigo-600 text-white rounded-lg font-semibold hover:bg-indigo-700"
        >
          🔍 Tìm kiếm
        </button>
      </div>
    </div>

    <!-- Results Section -->
    <div id="resultsSection" class="hidden bg-white rounded-lg shadow-lg p-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-bold text-gray-800">
          Kết quả (<span id="resultCount">0</span> đơn)
        </h2>
        <button id="clearBtn" class="text-gray-500 hover:text-gray-700">✕</button>
      </div>
      <div id="resultsList" class="space-y-4"></div>
    </div>
  </div>

  <script>
    const COLUMN_NAMES = [
      'MÃ VẬN ĐƠN', 'TÊN SHIP', 'ĐƠN VAT', 'THU TIỀN', 'TG XỬ LÝ',
      'TÌNH TRẠNG ĐƠN', 'LOẠI ĐƠN', 'PHÂN LOẠI LỖI', 'SẢN PHẨM', 'QUẬN',
      'GHI CHÚ CSKH', 'NGÀY GỬI', 'TRẠNG THÁI', 'THỜI GIAN GIAO DỰ KIẾN', 'KHO ĐI',
      'NGÀY CHỐT', 'THÁNG CHỐT', 'HỌ VÀ TÊN', 'SỐ ĐIỆN THOẠI', 'ĐỊA CHỈ',
      'TỈNH', 'QUẬN/HUYỆN', 'GHI CHÚ SALE', 'SỐ LƯỢNG', 'MẪU',
      'PHỤ KIỆN 1', 'PHỤ KIỆN 2', 'PHỤ KIỆN 3', 'PHỤ KIỆN 4', 'HÌNH THỨC THANH TOÁN',
      'GIÁ NIÊM YẾT', 'GIÁ GIẢM', 'CỌC', 'VAT', 'PHÍ KHÁC',
      'CÒN LẠI', 'SALE THU PHÍ KHÁC', 'CSKH THU PHÍ KHÁC', 'NGUỒN', 'PHÂN LOẠI KH',
      'KHOẢNG THỜI GIAN GIAO HÀNG DỰ KIẾN', 'SALES', 'KHO ĐI HÀNG'
    ];

    let allData = [];
    let currentEditingIndex = null;

    // ✅ CORS Proxy - Sử dụng AllOrigins (miễn phí)
    const CORS_PROXY = 'https://api.allorigins.win/raw?url=';

    function showStatus(message, type = 'info') {
      const el = document.getElementById('statusMessage');
      el.className = `p-4 rounded-lg mt-4 ${
        type === 'success' ? 'bg-green-50 border border-green-200 text-green-800' :
        type === 'error' ? 'bg-red-50 border border-red-200 text-red-800' :
        'bg-blue-50 border border-blue-200 text-blue-800'
      }`;
      el.textContent = message;
      el.classList.remove('hidden');
    }

    // Load data với CORS proxy
    document.getElementById('loadBtn').addEventListener('click', async () => {
      const apiUrl = document.getElementById('apiUrl').value.trim();
      if (!apiUrl) {
        showStatus('⚠️ Vui lòng nhập URL Google Apps Script!', 'error');
        return;
      }

      const btn = document.getElementById('loadBtn');
      btn.disabled = true;
      btn.textContent = '⏳ Đang tải...';
      showStatus('Đang tải dữ liệu qua CORS proxy... (có thể mất 20-40 giây)', 'info');

      try {
        const proxyUrl = CORS_PROXY + encodeURIComponent(apiUrl + '?action=loadAll');
        const response = await fetch(proxyUrl);
        const text = await response.text();
        const result = JSON.parse(text);

        if (result.success) {
          allData = result.data;
          showStatus(`✅ Tải thành công ${result.totalRows.toLocaleString()} đơn hàng!`, 'success');
          
          document.getElementById('totalRows').textContent = result.totalRows.toLocaleString();
          document.getElementById('totalSheets').textContent = new Set(result.data.map(d => d.sheetName)).size;
          document.getElementById('statsBox').classList.remove('hidden');
          document.getElementById('searchSection').classList.remove('hidden');
        } else {
          showStatus('❌ Lỗi: ' + result.error, 'error');
        }
      } catch (error) {
        showStatus('❌ Lỗi: ' + error.message + '. Khuyến nghị chạy trên local server!', 'error');
        console.error('Error:', error);
      }

      btn.disabled = false;
      btn.textContent = '🔄 Tải lại dữ liệu';
    });

    // Search
    document.getElementById('searchBtn').addEventListener('click', () => {
      const phone = document.getElementById('phoneInput').value.trim().replace(/\s/g, '');
      
      if (!phone) {
        showStatus('⚠️ Vui lòng nhập số điện thoại!', 'error');
        return;
      }

      const results = allData.filter(item => {
        const itemPhone = (item.data[18] || '').toString().replace(/\s/g, '');
        return itemPhone.includes(phone);
      });

      if (results.length === 0) {
        showStatus(`❌ Không tìm thấy kết quả cho: ${phone}`, 'error');
        document.getElementById('resultsSection').classList.add('hidden');
      } else {
        showStatus(`✅ Tìm thấy ${results.length} kết quả!`, 'success');
        displayResults(results);
      }
    });

    function displayResults(results) {
      const list = document.getElementById('resultsList');
      list.innerHTML = '';
      document.getElementById('resultCount').textContent = results.length;

      results.forEach((result, idx) => {
        const div = document.createElement('div');
        div.className = 'border border-gray-200 rounded-lg p-4';
        
        div.innerHTML = `
          <div class="flex items-center justify-between mb-3 pb-3 border-b">
            <div class="flex items-center gap-4">
              <span class="bg-indigo-100 text-indigo-800 px-3 py-1 rounded-full text-sm font-semibold">${result.fileName}</span>
              <span class="text-gray-600 text-sm">${result.sheetName}</span>
              <span class="text-gray-400 text-sm">Hàng ${result.rowIndex}</span>
            </div>
            <button onclick="toggleEdit(${idx})" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 text-sm font-semibold">
              ✏️ Chỉnh sửa
            </button>
          </div>
          
          <div class="grid grid-cols-2 gap-4 mb-3">
            <div><span class="font-semibold">Tên:</span> ${result.data[17] || 'N/A'}</div>
            <div><span class="font-semibold">SĐT:</span> ${result.data[18] || 'N/A'}</div>
            <div><span class="font-semibold">Mã VĐ:</span> ${result.data[0] || 'N/A'}</div>
            <div><span class="font-semibold">Tình trạng:</span> ${result.data[5] || 'N/A'}</div>
          </div>

          <div id="editForm-${idx}" class="hidden mt-4 bg-gray-50 p-4 rounded-lg max-h-96 overflow-y-auto">
            <h3 class="font-bold mb-3">Chỉnh sửa:</h3>
            <div class="space-y-3">
              ${COLUMN_NAMES.map((name, colIdx) => `
                <div class="flex gap-2">
                  <label class="w-48 text-sm font-medium pt-2">${name}:</label>
                  <input 
                    type="text" 
                    id="input-${idx}-${colIdx}"
                    value="${(result.data[colIdx] || '').toString().replace(/"/g, '&quot;')}"
                    class="flex-1 px-3 py-2 border rounded focus:ring-2 focus:ring-indigo-500"
                  >
                </div>
              `).join('')}
            </div>
            <div class="flex gap-3 mt-4">
              <button onclick="saveEdit(${idx})" class="flex-1 bg-green-600 text-white py-2 rounded-lg hover:bg-green-700">
                💾 Lưu
              </button>
              <button onclick="cancelEdit(${idx})" class="flex-1 bg-gray-500 text-white py-2 rounded-lg hover:bg-gray-600">
                ❌ Hủy
              </button>
            </div>
          </div>
        `;
        
        list.appendChild(div);
      });

      document.getElementById('resultsSection').classList.remove('hidden');
    }

    window.toggleEdit = function(idx) {
      const form = document.getElementById(`editForm-${idx}`);
      document.querySelectorAll('[id^="editForm-"]').forEach(f => f.classList.add('hidden'));
      if (form.classList.contains('hidden')) {
        form.classList.remove('hidden');
      }
    };

    window.cancelEdit = function(idx) {
      document.getElementById(`editForm-${idx}`).classList.add('hidden');
    };

    window.saveEdit = async function(idx) {
      const apiUrl = document.getElementById('apiUrl').value.trim();
      const results = allData.filter(item => {
        const phone = document.getElementById('phoneInput').value.trim().replace(/\s/g, '');
        const itemPhone = (item.data[18] || '').toString().replace(/\s/g, '');
        return itemPhone.includes(phone);
      });

      const result = results[idx];
      const updatedData = [];
      for (let colIdx = 0; colIdx < COLUMN_NAMES.length; colIdx++) {
        const input = document.getElementById(`input-${idx}-${colIdx}`);
        updatedData[colIdx] = input ? input.value : (result.data[colIdx] || '');
      }

      showStatus('💾 Đang lưu...', 'info');

      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'update',
            fileId: result.fileId,
            sheetName: result.sheetName,
            rowIndex: result.rowIndex,
            updatedData: updatedData
          })
        });

        const saveResult = await response.json();

        if (saveResult.success) {
          showStatus('✅ Lưu thành công!', 'success');
          const dataIndex = allData.findIndex(
            item => item.fileId === result.fileId && 
                    item.sheetName === result.sheetName && 
                    item.rowIndex === result.rowIndex
          );
          if (dataIndex !== -1) {
            allData[dataIndex].data = updatedData;
          }
          cancelEdit(idx);
          document.getElementById('searchBtn').click();
        } else {
          showStatus('❌ Lỗi: ' + saveResult.error, 'error');
        }
      } catch (error) {
        showStatus('❌ Lỗi: ' + error.message, 'error');
      }
    };

    document.getElementById('clearBtn').addEventListener('click', () => {
      document.getElementById('resultsSection').classList.add('hidden');
      document.getElementById('phoneInput').value = '';
    });

    document.getElementById('phoneInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('searchBtn').click();
    });
  </script>
</body>
</html>
